name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: unzip -q character-app.zip

      - name: Rename app to Kirdaar
        run: |
          cd character-app/app
          sed -i 's/Character Maker/Kirdaar/g' capacitor.config.json www/index.html
          sed -i 's/com.example.charactermaker/com.kirdaar.app/g' capacitor.config.json

      - name: Build APK
        run: |
          cd character-app/app
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kirdaar-apk
          path: character-app/app/android/app/build/outputs/apk/debug/app-debug.apk
